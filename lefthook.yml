# Pre-commit gate from docs/adr/0004. Session branches are pushed with
# --no-verify, so nothing runs on pre-push.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,cjs,json,css,md}'
      run: npx prettier --write {staged_files}
      stage_fixed: true

    - name: lint
      glob: '*.{ts,tsx,cjs}'
      # Files generated by ruflo are in .oxlintrc ignorePatterns; passing only those makes oxlint fail.
      exclude:
        - '.claude/helpers/**'
        - '.claude/agents/**'
        - '.claude/commands/**'
        - '.claude/skills/**'
        - '.claude-flow/**'
        - '.agents/**'
      run: npx oxlint {staged_files}

    - name: typecheck
      glob: '*.{ts,tsx}'
      run: npx tsc -b
